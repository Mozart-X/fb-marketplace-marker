<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1c1e21; --sub: #65676b; --line: #e4e6eb;
    --card: #f0f2f5; --accent: #1877f2; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#242526; --fg:#e4e6eb; --sub:#b0b3b8; --line:#3a3b3c; --card:#3a3b3c; --accent:#2d88ff; }
  }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0; padding: 14px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--sub); font-size: 11px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .label { font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; background: transparent; color: var(--fg); padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  textarea {
    width: 100%; height: 58px; resize: vertical; margin-top: 4px;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px;
    background: var(--card); color: var(--fg); font: inherit;
  }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { display: none; }
  .track { position:absolute; inset:0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .track::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.15s; }
  input:checked + .track { background: var(--accent); }
  input:checked + .track::after { transform: translateX(16px); }
  .stats { display:flex; gap:6px; margin: 12px 0 6px; }
  .stat { flex:1; background: var(--card); border-radius: 8px; padding: 8px; text-align:center; }
  .stat b { display:block; font-size: 16px; }
  .stat span { color: var(--sub); font-size: 10px; }
  .sellers { max-height: 110px; overflow:auto; margin: 6px 0; }
  .seller { display:flex; justify-content:space-between; align-items:center; padding:5px 8px; background:var(--card); border-radius:6px; margin-bottom:4px; }
  .seller button { border:none; background:none; color:var(--danger); cursor:pointer; font-size:14px; }
  .empty { color: var(--sub); font-size: 11px; padding: 4px 0; }
  .actions { display:flex; flex-direction:column; gap:6px; margin-top: 10px; }
  .actions button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:7px; cursor:pointer; font: inherit; }
  .actions button.danger { color: var(--danger); }
  hr { border:none; border-top:1px solid var(--line); margin: 12px 0; }
  .sec { font-weight:600; margin: 4px 0; }
</style>
</head>
<body>
  <h1>Marketplace Tidy</h1>
  <p class="sub">All data stays local in your browser.</p>

  <div class="row">
    <span class="label">Enabled</span>
    <label class="switch"><input type="checkbox" id="enabled"><span class="track"></span></label>
  </div>

  <div class="row">
    <span class="label">Seen listings</span>
    <div class="seg" id="seen">
      <button data-v="tag">Tag</button>
      <button data-v="dim">Dim</button>
      <button data-v="hide">Hide</button>
      <button data-v="off">Off</button>
    </div>
  </div>

  <div class="sec">Block keywords</div>
  <textarea id="keywords" placeholder="One per line (e.g. broken, for parts, salvage)"></textarea>

  <div class="stats">
    <div class="stat"><b id="cMarked">0</b><span>marked</span></div>
    <div class="stat"><b id="cMsg">0</b><span>messaged</span></div>
    <div class="stat"><b id="cItems">0</b><span>hidden</span></div>
    <div class="stat"><b id="cSeen">0</b><span>seen</span></div>
  </div>

  <div class="sec">Blocked sellers</div>
  <div class="sellers" id="sellers"></div>

  <div class="actions">
    <button id="clearMarks">Clear marks &amp; messaged tags</button>
    <button id="unhide">Unhide all listings</button>
    <button id="clearSeen">Clear seen history</button>
    <button id="reset" class="danger">Reset everything</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
